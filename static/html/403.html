<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Доступ ограничен — VoidSpace HUB</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body style="background: #090d16; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 16px; box-sizing: border-box;">

    <div class="loading-container" style="position: relative; background: transparent; display: flex; width: 100%; justify-content: center;">
        <div class="loading-card" style="text-align: center; max-width: 320px; width: 100%; padding: 24px; background: #111827; border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <img src="/logo.png" alt="VoidSpace HUB" class="logo" style="width: 64px; height: 64px; margin-bottom: 16px; object-fit: contain;">
            <h3 style="color: #f87171; margin-bottom: 8px; font-size: 20px;">Ну все, троян</h3>
            <p class="small" style="color: #94a3b8; line-height: 1.5; margin-bottom: 20px; font-size: 14px;">
                А, нет. Вас просто не обнаружили в списке доверенных людей, но вы можете это исправить. Нажми "Запросить доступ" и ты можешь стать частью нас :3
            </p>
            <a href="https://i.pinimg.com/736x/08/ed/d6/08edd6425516ed4803e0058c2522224e.jpg" target="_blank" class="btn-copy" style="display: block; text-align: center; text-decoration: none; background: #3b82f6; color: white; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px;">
                Запросить доступ
            </a>
        </div>
    </div>

</body>
</html>
