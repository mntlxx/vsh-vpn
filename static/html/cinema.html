<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoidSpace HUB — Кино</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <input type="text" id="sub_link" readonly onclick="this.select()" style="display: none;">
    <div id="toast" class="toast">Скопировано в буфер обмена!</div>

    <div id="content" class="content show-up" style="display: flex;">
        <header class="header">
            <img src="../logo.png" alt="VoidSpace HUB" class="logo-small">
            <p class="subtitle">Кинотеатр и Медиа</p>
        </header>

        <div class="cards">
            <div class="card">
                <div class="card-header">
                    <h3>Доступные медиасервисы</h3>
                </div>
                <p class="small">Высокая скорость соединения позволяет просматривать фильмы в 4K HDR без задержек буферизации.</p>
                <div class="input-group">
                    <button class="btn-copy" onclick="showToast('Каталог синхронизируется')">Открыть каталог релизов</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-wrapper">
        <div id="expanded-menu" class="expanded-menu">
            <div class="menu-grid">
                <div class="grid-row-top">
                    <button class="grid-btn flex-row" onclick="location.href='../index.html'">
                        <img src="../svg/copy.svg" width="20" height="20" alt="Главная">
                        <span>Главная</span>
                    </button>
                    <button class="grid-btn flex-row" onclick="onMenuClick('Профиль')">
                        <img src="../svg/profile.svg" width="20" height="20" alt="Профиль">
                        <span>Профиль</span>
                    </button>
                </div>
                <div class="grid-row-bottom">
                    <button class="grid-btn" onclick="location.href='youtube.html'">
                        <img src="../svg/youtube.svg" width="22" height="22" alt="YouTube">
                        <span>YouTube</span>
                    </button>
                    <button class="grid-btn" style="background: rgba(59, 130, 246, 0.2);" onclick="location.href='cinema.html'">
                        <img src="../svg/cinema.svg" width="22" height="22" alt="Кино">
                        <span>Кино</span>
                    </button>
                    <button class="grid-btn" onclick="location.href='player.html'">
                        <img src="../svg/player.svg" width="22" height="22" alt="Плеер">
                        <span>Плеер</span>
                    </button>
                </div>
            </div>
        </div>
        <nav id="footer-panel" class="footer-nav">
            <a href="../index.html" class="nav-item" title="Главная">
                <img src="../svg/main.svg" width="22" height="22" alt="Главная">
            </a>
            <a href="#" class="nav-item" title="Настройки">
                <img src="../svg/settings.svg" width="22" height="22" alt="Настройки">
            </a>
            <button class="nav-more-btn" onclick="toggleMoreSettings()">
                <span id="more-icon">▲</span>
            </button>
        </nav>
    </footer>

    <script src="../js/index.js"></script>
</body>
</html>
